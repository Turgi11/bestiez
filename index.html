<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בסטיז</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --text: #1c1b19;
    --muted: #6b665e;
    --line: #e4dfd5;
    --accent: #b8501f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141310;
      --card: #1e1c18;
      --text: #f2efe9;
      --muted: #a69f93;
      --line: #322e28;
      --accent: #f09256;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 56px 18px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Heebo", "Arial Hebrew", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.65;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 34px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.6px; }
  .lead { color: var(--muted); margin: 0 0 28px; }
  nav { display: grid; gap: 12px; }
  nav a {
    display: block;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 20px;
    color: var(--accent);
    font-size: 19px;
    font-weight: 600;
    text-decoration: none;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-top: 36px;
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>בסטיז</h1>
  <p class="lead">אפליקציה עם חיית מחמד וירטואלית בפיקסל־ארט, שחיה על מסך הבית, על מסך הנעילה ובאי הדינמי.</p>

  <nav>
    <a href="privacy.html">מדיניות פרטיות</a>
    <a href="terms.html">תנאי שימוש</a>
    <a href="support.html">תמיכה</a>
  </nav>

  <footer>בסטיז</footer>

</div>
</body>
</html>
